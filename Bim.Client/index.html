<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartBIM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- CSS Cinématique Global -->
    <link href="/global-cinematics.css" rel="stylesheet">
    <link href="/super-cinematics.css" rel="stylesheet">
    <!-- Add WASM mount point -->
    <script type="module">
      window.wasmPath = '/wasm/';
    </script>
    <style>
      /* Styles cinématiques de base pour s'assurer qu'ils sont chargés même si le CSS externe ne l'est pas */
      .cinematic-bg {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        right: 0 !important;
        height: 100vh !important;
        z-index: -1 !important;
        overflow: hidden !important;
        background: linear-gradient(135deg, #020617, #0f172a, #172554) !important;
        opacity: 1 !important;
      }

      .tech-grid {
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        right: 0 !important;
        bottom: 0 !important;
        background-image: 
          linear-gradient(rgba(59, 130, 246, 0.1) 1px, transparent 1px),
          linear-gradient(90deg, rgba(59, 130, 246, 0.1) 1px, transparent 1px) !important;
        background-size: 30px 30px !important;
        animation: gridMove 15s infinite linear !important;
      }

      .tech-particles {
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        right: 0 !important;
        bottom: 0 !important;
        background-image: radial-gradient(#60a5fa 1px, transparent 1px) !important;
        background-size: 50px 50px !important;
        animation: particleFade 20s infinite alternate !important;
      }

      @keyframes gridMove {
        0% { background-position: 0 0; }
        100% { background-position: 30px 30px; }
      }

      @keyframes particleFade {
        0% { opacity: 0.2; transform: translateY(0); }
        50% { opacity: 0.5; }
        100% { opacity: 0.2; transform: translateY(20px); }
      }

      /* Styles pour le bouton néon */
      .neon-button {
        position: relative !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        gap: 8px !important;
        padding: 8px 16px !important;
        background: rgba(2, 132, 199, 0.2) !important;
        border: 1px solid rgba(14, 165, 233, 0.5) !important;
        border-radius: 24px !important;
        color: white !important;
        font-weight: 500 !important;
        cursor: pointer !important;
        overflow: hidden !important;
        box-shadow: 0 0 10px rgba(14, 165, 233, 0.3), inset 0 0 5px rgba(14, 165, 233, 0.2) !important;
      }

      .neon-button:hover {
        background: rgba(2, 132, 199, 0.3) !important;
        box-shadow: 0 0 15px rgba(14, 165, 233, 0.5), inset 0 0 8px rgba(14, 165, 233, 0.4) !important;
      }

      .neon-glow {
        position: absolute !important;
        top: 0 !important;
        left: -100% !important;
        width: 50% !important;
        height: 100% !important;
        background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.3), transparent) !important;
        animation: neonSweep 3s linear infinite !important;
      }

      @keyframes neonSweep {
        0% { left: -100%; }
        50%, 100% { left: 200%; }
      }
    </style>
  </head>
  <body>
    <!-- Animation de fond cinématique ajoutée directement dans le HTML -->
    <div class="cinematic-bg active">
      <div class="tech-grid"></div>
      <div class="tech-particles"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
