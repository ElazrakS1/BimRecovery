<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WASM Loading Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .warning { background-color: #fff3cd; color: #856404; border: 1px solid #ffeaa7; }
        .loading { background-color: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
    </style>
</head>
<body>
    <h1>WebAssembly (WASM) Loading Test</h1>
    <p>Testing if the WASM files are properly configured and accessible...</p>
    
    <div id="results"></div>
    
    <script type="module">
        const resultsDiv = document.getElementById('results');
        
        function addResult(message, type = 'loading') {
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.textContent = message;
            resultsDiv.appendChild(div);
            console.log(`[${type.toUpperCase()}] ${message}`);
        }
        
        async function testWasmFiles() {
            addResult('Starting WASM file tests...', 'loading');
            
            const baseUrl = window.location.origin;
            const wasmFiles = [
                '/wasm/web-ifc.wasm',
                '/wasm/web-ifc-mt.wasm', 
                '/wasm/web-ifc-mt.worker.js'
            ];
            
            // Test 1: Check if WASM files exist
            for (const file of wasmFiles) {
                try {
                    const response = await fetch(`${baseUrl}${file}`, { method: 'HEAD' });
                    if (response.ok) {
                        addResult(`✓ File found: ${file}`, 'success');
                    } else {
                        addResult(`✗ File not found: ${file} (${response.status})`, 'error');
                    }
                } catch (error) {
                    addResult(`✗ Error checking ${file}: ${error.message}`, 'error');
                }
            }
            
            // Test 2: Test WebAssembly support
            addResult('Testing WebAssembly support...', 'loading');
            if (typeof WebAssembly === 'object') {
                addResult('✓ WebAssembly is supported', 'success');
                
                // Test instantiateStreaming support
                if (WebAssembly.instantiateStreaming) {
                    addResult('✓ WebAssembly.instantiateStreaming is supported', 'success');
                } else {
                    addResult('⚠ WebAssembly.instantiateStreaming not supported (fallback available)', 'warning');
                }
            } else {
                addResult('✗ WebAssembly is not supported', 'error');
            }
            
            // Test 3: Try to load and instantiate web-ifc.wasm
            addResult('Testing WASM instantiation...', 'loading');
            try {
                const wasmResponse = await fetch(`${baseUrl}/wasm/web-ifc.wasm`);
                if (wasmResponse.ok) {
                    const wasmBuffer = await wasmResponse.arrayBuffer();
                    
                    // Try to instantiate (without imports for now, just to test loading)
                    try {
                        const wasmModule = await WebAssembly.compile(wasmBuffer);
                        addResult('✓ web-ifc.wasm compiled successfully', 'success');
                        
                        // Get module info
                        const imports = WebAssembly.Module.imports(wasmModule);
                        const exports = WebAssembly.Module.exports(wasmModule);
                        addResult(`✓ Module has ${imports.length} imports and ${exports.length} exports`, 'success');
                        
                    } catch (compileError) {
                        addResult(`✗ Failed to compile WASM: ${compileError.message}`, 'error');
                    }
                } else {
                    addResult(`✗ Failed to fetch web-ifc.wasm: ${wasmResponse.status}`, 'error');
                }
            } catch (error) {
                addResult(`✗ Error testing WASM instantiation: ${error.message}`, 'error');
            }
            
            // Test 4: Try to load the web-ifc library
            addResult('Testing web-ifc library initialization...', 'loading');
            try {
                // Dynamically import web-ifc to test if it can load with our WASM setup
                const { IfcAPI } = await import('./node_modules/web-ifc/web-ifc-api.js');
                
                const ifcApi = new IfcAPI();
                await ifcApi.Init();
                
                addResult('✓ web-ifc library initialized successfully', 'success');
                addResult('🎉 All WASM tests passed! The linking error should be resolved.', 'success');
                
            } catch (ifcError) {
                if (ifcError.message.includes('Cannot read properties of null')) {
                    addResult(`✗ WASM linking error still present: ${ifcError.message}`, 'error');
                    addResult('This indicates the version compatibility issue may not be fully resolved.', 'error');
                } else if (ifcError.message.includes('Import #49')) {
                    addResult(`✗ WebAssembly import error: ${ifcError.message}`, 'error');
                    addResult('This suggests missing or incompatible WASM functions.', 'error');
                } else {
                    addResult(`✗ web-ifc initialization failed: ${ifcError.message}`, 'error');
                }
            }
            
            addResult('WASM testing completed.', 'loading');
        }
        
        // Run tests when page loads
        window.addEventListener('load', testWasmFiles);
    </script>
</body>
</html>
